<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barcode System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Barcode System</h2>
        
        <!-- Input Teks -->
        <input type="text" id="inputText" value="Ngjjb">

        <!-- TAMBAHKAN INI: Elemen SVG untuk tempat munculnya barcode -->
        <div class="barcode-container" style="margin: 20px 0; text-align: center;">
            <svg id="barcode"></svg>
        </div>

        <button id="scanBtn">📷 Scan Barcode</button>
        
        <div class="result">
            <p>Hasil Scan:</p>
            <span id="scanResult">-</span>
        </div>
        
        <button class="btn-lokasi">📍 Daftar Lokasi</button>
        <button class="btn-perbesar">Perbesar Barcode</button>

        <footer>
            <p>Barcode System v1.2.0</p>
            <p>&copy; 2026</p>
        </footer>
    </div>

    <!-- Panggil Library JsBarcode (pastikan nama file sesuai di repo) -->
    <script src="JsBarcode.all.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
